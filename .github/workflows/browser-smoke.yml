name: CITS Browser E2E Smoke

on:
  push:
    branches:
      - fix/atomic-attendance-sync-20261122
      - 'design/**'
      - 'release/**'
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-guest-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout reviewed branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install app dependencies
        run: bun install --frozen-lockfile

      - name: Build test target (production bundle)
        run: bun run build

      # Install only in the ephemeral runner; Playwright is not shipped in app bundle.
      - name: Install pinned browser test tooling
        run: npm install --no-save --package-lock=false @playwright/test@1.55.1

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Verify sign-in, RTL and mobile UI in real Chromium
        run: npx playwright test --config playwright.config.ts --reporter=line

      - name: Verify all Admin and Instructor navigation modules in isolated local sandbox
        run: npx playwright test --config playwright.sandbox.config.ts --reporter=line

      # Vercel Deployment Protection stays enabled. Never weaken it for CI.
      # Only run this remote step when a valid, short-lived Trusted Sources
      # token has been configured securely; otherwise report the release gate.
      - name: Determine protected preview browser access
        id: staging_access
        env:
          VERCEL_OIDC_TOKEN: ${{ secrets.VERCEL_OIDC_TOKEN }}
        run: |
          if [ -n "$VERCEL_OIDC_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Protected Staging guest E2E: SKIPPED — no short-lived Vercel Trusted Sources token. Deployment Protection remains enabled." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Verify connected Staging preview in Chromium (protected)
        if: ${{ steps.staging_access.outputs.available == 'true' }}
        env:
          BASE_URL: https://operation-lms-staging-salah-2543.vercel.app
          VERCEL_OIDC_TOKEN: ${{ secrets.VERCEL_OIDC_TOKEN }}
        run: npx playwright test --config playwright.config.ts --reporter=line
