name: Supabase Staging Security & Verification

on:
  workflow_dispatch:
    inputs:
      apply_0005:
        description: 'Apply 0005_phase2_finalization_hardening.sql before running verification suites'
        required: true
        default: 'true'
        type: boolean
      apply_0006_to_0008:
        description: 'Apply migrations 0006, 0007, and 0008 before running verification suites'
        required: true
        default: 'true'
        type: boolean

jobs:
  staging-verify:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Validate Staging DB Secret & Block Production Target
        env:
          SUPABASE_STAGING_DB_URL: ${{ secrets.SUPABASE_STAGING_DB_URL }}
        run: |
          if [ -z "$SUPABASE_STAGING_DB_URL" ]; then
            echo "ERROR: secrets.SUPABASE_STAGING_DB_URL is not configured."
            exit 1
          fi
          case "$SUPABASE_STAGING_DB_URL" in
            *wdmlxsgbjkboadkeekdq*)
              echo "ERROR: SUPABASE_STAGING_DB_URL references production project wdmlxsgbjkboadkeekdq. Aborting."
              exit 1
              ;;
          esac
          mkdir -p staging-reports

      - name: Run Read-Only Preflight Inventory (0005)
        env:
          PGURL: ${{ secrets.SUPABASE_STAGING_DB_URL }}
        run: |
          psql "$PGURL" -v ON_ERROR_STOP=1 -f supabase/verification/0005_security_inventory_and_preflight.sql \
            | tee staging-reports/01-preflight-inventory.log

      - name: Apply Migration 0005 (Staging)
        if: ${{ inputs.apply_0005 == true }}
        env:
          PGURL: ${{ secrets.SUPABASE_STAGING_DB_URL }}
        run: |
          psql "$PGURL" -v ON_ERROR_STOP=1 -f supabase/migrations/0005_phase2_finalization_hardening.sql \
            | tee staging-reports/02-migration-0005.log

      - name: Apply Migrations 0006–0008 (Staging)
        if: ${{ inputs.apply_0006_to_0008 == true }}
        env:
          PGURL: ${{ secrets.SUPABASE_STAGING_DB_URL }}
        run: |
          psql "$PGURL" -v ON_ERROR_STOP=1 -f supabase/migrations/0006_fix_initial_password_change_audit.sql \
            | tee staging-reports/02b-migration-0006.log
          psql "$PGURL" -v ON_ERROR_STOP=1 -f supabase/migrations/0007_enforce_forced_password_change_security.sql \
            | tee staging-reports/02c-migration-0007.log
          psql "$PGURL" -v ON_ERROR_STOP=1 -f supabase/migrations/0008_security_phase_closure_hardening.sql \
            | tee staging-reports/02d-migration-0008.log

      - name: Run Transactional RLS & Guard 1C Suite (0003)
        env:
          PGURL: ${{ secrets.SUPABASE_STAGING_DB_URL }}
        run: |
          psql "$PGURL" -v ON_ERROR_STOP=1 -f supabase/verification/0003_remote_verification_and_rls_test_suite.sql \
            2>&1 | tee staging-reports/03-suite-0003.log
          if grep -Eq '\|\s*FAIL\s*\||\[FAIL ' staging-reports/03-suite-0003.log; then
            echo "ERROR: Suite 0003 reported FAIL result(s)."
            exit 1
          fi

      - name: Run Phase 2 Hardening Verification Suite (0004)
        env:
          PGURL: ${{ secrets.SUPABASE_STAGING_DB_URL }}
        run: |
          psql "$PGURL" -v ON_ERROR_STOP=1 -f supabase/verification/0004_phase2_hardening_verification.sql \
            2>&1 | tee staging-reports/04-suite-0004.log
          if grep -Eq '\|\s*FAIL\s*\|' staging-reports/04-suite-0004.log; then
            echo "ERROR: Suite 0004 reported FAIL result(s)."
            exit 1
          fi

      - name: Run 30-Case Phase 2 Finalization Suite (0005)
        env:
          PGURL: ${{ secrets.SUPABASE_STAGING_DB_URL }}
        run: |
          psql "$PGURL" -v ON_ERROR_STOP=1 -f supabase/verification/0005_finalization_behavioral_test_suite.sql \
            2>&1 | tee staging-reports/05-suite-0005.log
          if grep -Eq '\|\s*FAIL\s*\|' staging-reports/05-suite-0005.log; then
            echo "ERROR: Suite 0005 reported FAIL result(s)."
            exit 1
          fi

      - name: Run Password Audit, Forced Password Change & Security Closure Suites (0006–0008)
        env:
          PGURL: ${{ secrets.SUPABASE_STAGING_DB_URL }}
        run: |
          psql "$PGURL" -v ON_ERROR_STOP=1 -f supabase/verification/0006_verify_initial_password_change_audit.sql \
            2>&1 | tee staging-reports/06a-suite-0006.log
          if grep -Eq '\|\s*FAIL\s*\|' staging-reports/06a-suite-0006.log; then
            echo "ERROR: Suite 0006 reported FAIL result(s)."
            exit 1
          fi
          psql "$PGURL" -v ON_ERROR_STOP=1 -f supabase/verification/0007_verify_forced_password_change_security.sql \
            2>&1 | tee staging-reports/06b-suite-0007.log
          if grep -Eq '\|\s*FAIL\s*\|' staging-reports/06b-suite-0007.log; then
            echo "ERROR: Suite 0007 reported FAIL result(s)."
            exit 1
          fi
          psql "$PGURL" -v ON_ERROR_STOP=1 -f supabase/verification/0008_verify_security_phase_closure.sql \
            2>&1 | tee staging-reports/06c-suite-0008.log
          if grep -Eq '\|\s*FAIL\s*\|' staging-reports/06c-suite-0008.log; then
            echo "ERROR: Suite 0008 reported FAIL result(s)."
            exit 1
          fi

      - name: Post-Migration Security Inventory Snapshot (0005)
        env:
          PGURL: ${{ secrets.SUPABASE_STAGING_DB_URL }}
        run: |
          psql "$PGURL" -v ON_ERROR_STOP=1 -f supabase/verification/0005_security_inventory_and_preflight.sql \
            | tee staging-reports/07-post-inventory.log

      - name: Publish Audit Summary & Upload Staging Verification Artifacts
        if: always()
        run: |
          {
            echo "## Supabase Staging Verification Results"
            echo ""
            for f in staging-reports/*.log; do
              [ -f "$f" ] || continue
              echo "### $(basename "$f")"
              echo '```'
              tail -n 60 "$f"
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Staging Verification Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-staging-verification-reports
          path: staging-reports/*.log
          retention-days: 30
