# =============================================================================
# Supabase Staging Database Migration & SQL Security Verification Workflow
#
# SCOPE NOTICE:
#   This workflow applies ordered PostgreSQL migrations (0005 -> 0009) and runs
#   all 7 non-destructive transactional SQL verification suites (0003 -> 0009)
#   strictly against a STAGING database.
#   It does NOT deploy Supabase Edge Functions (auth-login, provision-instructor)
#   and does NOT deploy the frontend. Edge Functions MUST be deployed separately
#   via Supabase CLI (`supabase functions deploy`) before running live E2E tests.
# =============================================================================

name: Supabase Staging Security & Verification

on:
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: 'Set true only to apply migrations 0005 -> 0009. False verifies an already-migrated Staging database without writes.'
        required: true
        default: false
        type: boolean

jobs:
  staging-verify:
    runs-on: ubuntu-latest
    environment: staging
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Validate Staging DB Secret & Require Exact Staging Project
        env:
          SUPABASE_STAGING_DB_URL: ${{ secrets.SUPABASE_STAGING_DB_URL }}
          STAGING_PROJECT_REF: uewhudbufykfkhimvqjj
          PRODUCTION_PROJECT_REF: wdmlxsgbjkboadkeekdq
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_STAGING_DB_URL" ]; then
            echo "ERROR: secrets.SUPABASE_STAGING_DB_URL is not configured."
            exit 1
          fi
          LOWER_URL="$(printf '%s' "$SUPABASE_STAGING_DB_URL" | tr '[:upper:]' '[:lower:]')"
          case "$LOWER_URL" in
            *wdmlxsgbjkboadkeekdq*)
              echo "ERROR: SUPABASE_STAGING_DB_URL references production project wdmlxsgbjkboadkeekdq. Aborting."
              exit 1
              ;;
          esac

          # Parse the connection URI without printing it. Accept only the exact
          # Staging project's direct endpoint or Supabase session pooler identity.
          python3 - <<'PY'
          import os
          import sys
          from urllib.parse import unquote, urlsplit

          raw_url = (os.environ.get("SUPABASE_STAGING_DB_URL") or "").strip()
          staging_ref = os.environ["STAGING_PROJECT_REF"]
          production_ref = os.environ["PRODUCTION_PROJECT_REF"]

          try:
              parsed = urlsplit(raw_url)
              host = (parsed.hostname or "").lower()
              username = unquote(parsed.username or "")
              database = unquote(parsed.path.lstrip("/"))
              port = parsed.port
          except Exception:
              print("ERROR: SUPABASE_STAGING_DB_URL is not a valid PostgreSQL URI.")
              sys.exit(1)

          if parsed.scheme not in ("postgres", "postgresql"):
              print("ERROR: Staging connection must use a postgres:// or postgresql:// URI.")
              sys.exit(1)

          if production_ref in host or production_ref in username:
              print("ERROR: Production project identity detected. No database command was run.")
              sys.exit(1)

          direct_target = (
              host == f"db.{staging_ref}.supabase.co"
              and username == "postgres"
          )
          session_pooler_target = (
              host.endswith(".pooler.supabase.com")
              and username == f"postgres.{staging_ref}"
          )

          if database != "postgres" or port not in (None, 5432) or not (direct_target or session_pooler_target):
              print(
                  "ERROR: Connection does not identify the approved Supabase Staging project. "
                  "Use its direct host with user 'postgres', or its session pooler with "
                  "user 'postgres.<staging-project-ref>'."
              )
              sys.exit(1)

          print("Validated database target: approved Supabase Staging project.")
          PY

          mkdir -p staging-reports

      - name: Schema Readiness Preflight Gate (Require Baseline 0001–0004)
        env:
          PGURL: ${{ secrets.SUPABASE_STAGING_DB_URL }}
        run: |
          set -euo pipefail
          TABLE_COUNT="$(psql "$PGURL" -v ON_ERROR_STOP=1 -Atc "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = 'public' AND table_type = 'BASE TABLE';")"
          echo "Detected public base table count: ${TABLE_COUNT}"
          if [ "$TABLE_COUNT" -ne 29 ]; then
            echo "ERROR: Expected 29 public base tables from baseline migrations 0001–0004, found ${TABLE_COUNT}. Aborting to avoid incomplete-schema verification."
            exit 1
          fi
          if [ "${{ inputs.apply_migrations }}" != "true" ]; then
            HAS_0008="$(psql "$PGURL" -v ON_ERROR_STOP=1 -Atc "SELECT CASE WHEN to_regclass('cits_internal.auth_login_rate_limits') IS NOT NULL AND to_regprocedure('public.evaluate_login_rate_limit_internal(text,text,boolean)') IS NOT NULL THEN 'ok' ELSE 'missing' END;")"
            if [ "$HAS_0008" != "ok" ]; then
              echo "ERROR: apply_migrations=false was selected, but Migration 0008 artifacts are missing from Staging DB. Re-run with apply_migrations=true."
              exit 1
            fi
            HAS_0009="$(psql "$PGURL" -v ON_ERROR_STOP=1 -Atc "SELECT CASE WHEN EXISTS (SELECT 1 FROM pg_policies WHERE schemaname='public' AND tablename='students' AND policyname='Instructors read permitted student rosters' AND qual LIKE '%is_instructor_assigned_to_group%' AND qual NOT LIKE '%is_instructor_assigned_to_camp%') THEN 'ok' ELSE 'missing' END;")"
            if [ "$HAS_0009" != "ok" ]; then
              echo "ERROR: apply_migrations=false was selected but Migration 0009 instructor roster isolation is missing from Staging."
              exit 1
            fi
          fi

      - name: Run Read-Only Preflight Inventory (0005)
        env:
          PGURL: ${{ secrets.SUPABASE_STAGING_DB_URL }}
        run: |
          set -euo pipefail
          psql "$PGURL" -v ON_ERROR_STOP=1 -f supabase/verification/0005_security_inventory_and_preflight.sql \
            2>&1 | tee staging-reports/01-preflight-inventory.log

      - name: Apply Ordered Forward-Only Migrations 0005 -> 0006 -> 0007 -> 0008 -> 0009 (Staging)
        if: ${{ inputs.apply_migrations == true }}
        env:
          PGURL: ${{ secrets.SUPABASE_STAGING_DB_URL }}
        run: |
          set -euo pipefail
          psql "$PGURL" -v ON_ERROR_STOP=1 -f supabase/migrations/0005_phase2_finalization_hardening.sql \
            2>&1 | tee staging-reports/02a-migration-0005.log
          psql "$PGURL" -v ON_ERROR_STOP=1 -f supabase/migrations/0006_fix_initial_password_change_audit.sql \
            2>&1 | tee staging-reports/02b-migration-0006.log
          psql "$PGURL" -v ON_ERROR_STOP=1 -f supabase/migrations/0007_enforce_forced_password_change_security.sql \
            2>&1 | tee staging-reports/02c-migration-0007.log
          psql "$PGURL" -v ON_ERROR_STOP=1 -f supabase/migrations/0008_security_phase_closure_hardening.sql \
            2>&1 | tee staging-reports/02d-migration-0008.log
          psql "$PGURL" -v ON_ERROR_STOP=1 -f supabase/migrations/0009_instructor_group_roster_isolation.sql \
            2>&1 | tee staging-reports/02e-migration-0009.log

      - name: Run All 7 Transactional Verification Suites (0003–0009) with Strict Pass/Fail Enforcement
        env:
          PGURL: ${{ secrets.SUPABASE_STAGING_DB_URL }}
        run: |
          set -euo pipefail

          run_suite() {
            local label="$1"
            local sql_file="$2"
            local log_file="$3"
            local pass_pattern="$4"

            echo "=== Running ${label} (${sql_file}) ==="
            psql "$PGURL" -v ON_ERROR_STOP=1 -f "$sql_file" 2>&1 | tee "$log_file"

            if grep -Eq '\|\s*FAIL\s*\||\[FAIL |^ERROR:|^FATAL:' "$log_file"; then
              echo "ERROR: ${label} reported FAIL or PostgreSQL ERROR/FATAL."
              exit 1
            fi

            if ! grep -Eq "$pass_pattern" "$log_file"; then
              echo "ERROR: ${label} produced no PASS rows (possible truncated/aborted run)."
              exit 1
            fi
          }

          run_suite "Suite 0003 (RLS & Guard 1C)" \
            "supabase/verification/0003_remote_verification_and_rls_test_suite.sql" \
            "staging-reports/03-suite-0003.log" \
            '\|\s*PASS\s*\||\[PASS '

          run_suite "Suite 0004 (Phase 2 Hardening)" \
            "supabase/verification/0004_phase2_hardening_verification.sql" \
            "staging-reports/04-suite-0004.log" \
            '\|\s*PASS\s*\|'

          run_suite "Suite 0005 (30-Case Finalization)" \
            "supabase/verification/0005_finalization_behavioral_test_suite.sql" \
            "staging-reports/05-suite-0005.log" \
            '\|\s*PASS\s*\|'

          run_suite "Suite 0006 (Password Audit)" \
            "supabase/verification/0006_verify_initial_password_change_audit.sql" \
            "staging-reports/06a-suite-0006.log" \
            '\|\s*PASS\s*\|'

          run_suite "Suite 0007 (Forced Password Change)" \
            "supabase/verification/0007_verify_forced_password_change_security.sql" \
            "staging-reports/06b-suite-0007.log" \
            '\|\s*PASS\s*\|'

          run_suite "Suite 0008 (Security Phase Closure)" \
            "supabase/verification/0008_verify_security_phase_closure.sql" \
            "staging-reports/06c-suite-0008.log" \
            '\|\s*PASS\s*\|'

          run_suite "Suite 0009 (Instructor Group Roster Isolation)" \
            "supabase/verification/0009_verify_instructor_group_roster_isolation.sql" \
            "staging-reports/06d-suite-0009.log" \
            '\\[PASS 0009\\]'

      - name: Post-Migration Security Inventory Snapshot (0005)
        env:
          PGURL: ${{ secrets.SUPABASE_STAGING_DB_URL }}
        run: |
          set -euo pipefail
          psql "$PGURL" -v ON_ERROR_STOP=1 -f supabase/verification/0005_security_inventory_and_preflight.sql \
            2>&1 | tee staging-reports/07-post-inventory.log

      - name: Publish Audit Summary & Upload Staging Verification Artifacts
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## Supabase Staging Database Verification Results"
            echo ""
            echo "> **Scope Notice:** This workflow verifies PostgreSQL migrations (0005–0009) and transactional SQL verification suites (0003–0009) only. It does **not** deploy Edge Functions (\`auth-login\`, \`provision-instructor\`). Deploy both Edge Functions separately before executing live Staging E2E tests."
            echo ""
            for f in staging-reports/*.log; do
              [ -f "$f" ] || continue
              echo "### $(basename "$f")"
              echo '```'
              tail -n 60 "$f"
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Staging Verification Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-staging-verification-reports
          path: staging-reports/*.log
          retention-days: 30
