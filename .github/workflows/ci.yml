name: CITS Web CI

on:
  push:
    # Validate unmerged staging feature/fix branches as well as main.
    branches: [main, phase-2-finalization, 'feat/**', 'fix/**']
  pull_request:
    # Run for stacked Draft PRs too, not only PRs directly targeting main.
    branches: [main, 'feat/**', 'fix/**']

jobs:
  verify-app-and-sql-static:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript typecheck & lint
        run: bun run lint

      - name: Run domain, attendance, security and XLSX export tests
        run: bun test src/domain src/lib/supabase.test.ts src/services/tinyXlsxWorkbook.test.ts src/services/campAttendanceWorkbookExport.test.ts

      - name: Build production bundle
        run: bun run build
