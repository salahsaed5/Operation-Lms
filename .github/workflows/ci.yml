name: CITS Web CI

on:
  push:
    branches: [main, phase-2-finalization]
  pull_request:
    branches: [main]

jobs:
  verify-app-and-sql-static:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript typecheck & lint
        run: bun run lint

      - name: Run domain, account provisioning, security policy, and Guard 1C lexical tests
        run: bun test src/domain/businessRules.test.ts src/domain/accountProvisioning.test.ts src/services/operationalSnapshotReadGuard.test.ts

      - name: Build production bundle
        run: bun run build
